<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#172750"/>
      <stop offset="50%" stop-color="#090d20"/>
      <stop offset="100%" stop-color="#050710"/>
    </radialGradient>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="#55f6ff" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Glowing Grid Lines -->
  <line x1="184" y1="80" x2="184" y2="432" stroke="#53668e" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <line x1="328" y1="80" x2="328" y2="432" stroke="#53668e" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <line x1="80" y1="184" x2="432" y2="184" stroke="#53668e" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <line x1="80" y1="328" x2="432" y2="328" stroke="#53668e" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

  <!-- Neon X (Cyan) -->
  <g filter="url(#glowCyan)">
    <line x1="90" y1="90" x2="160" y2="160" stroke="#55f6ff" stroke-width="18" stroke-linecap="round"/>
    <line x1="160" y1="90" x2="90" y2="160" stroke="#55f6ff" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Neon O (Pink) -->
  <g filter="url(#glowPink)">
    <circle cx="380" cy="380" r="42" fill="none" stroke="#ff4fd8" stroke-width="18"/>
  </g>

  <!-- Center Win X (Gold) -->
  <g filter="url(#glowCyan)">
    <line x1="216" y1="216" x2="296" y2="296" stroke="#ffe78a" stroke-width="22" stroke-linecap="round"/>
    <line x1="296" y1="216" x2="216" y2="296" stroke="#ffe78a" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>

